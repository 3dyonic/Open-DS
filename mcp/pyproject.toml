[project]
name = "open-ds-mcp"
version = "0.1.0"
description = "MCP server for Open DS: list the schemes, explain their decisions, and deploy one through the open-ds CLI. It runs no model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "3dyonic" }]
keywords = ["design-system", "mcp"]
dependencies = [
  "fastmcp>=2.13,<5",
]

[project.urls]
Repository = "https://github.com/3dyonic/Open-DS"
Issues = "https://github.com/3dyonic/Open-DS/issues"

[project.scripts]
open-ds-mcp = "open_ds_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_ds_mcp"]
