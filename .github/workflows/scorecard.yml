# OpenSSF Scorecard (Jira OD-201): how well the repository follows security practices. Results go to
# the Security tab and to scorecard.dev, which feeds the README badge. Scorecard needs this workflow
# to hold only this job, with read-only permissions at the top.
name: scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 6 * * 2"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
