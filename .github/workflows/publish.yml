# Releases the CLI on every merge to master (OD-199): the merge is the release decision.
# When master's cli/package.json has a version with no tag yet:
#   1. test what ships;
#   2. npmjs:           open-ds, through npm Trusted Publishing (no stored token), with provenance;
#   3. GitHub Packages: @3dyonic/open-ds, with GITHUB_TOKEN, so it shows on the repository's Packages page;
#   4. create the tag v<version> and its GitHub release, with notes from the merged PRs;
#   5. attach the Figma kits plugin to the release.
# A push to master whose version already has a tag does nothing. A release published by hand runs the
# same steps for its tag. Run it by hand with dry_run to see what would be published.
name: publish

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check only; publish nothing.
        type: boolean
        default: true

# Read-only by default. Only the job that publishes gets write access (OD-201).
permissions:
  contents: read

jobs:
  # Is there something to release? On a push, only when the version has no tag yet.
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.plan.outputs.go }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::notice title=publish::v$version is already released; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  cli:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      # write: to create the tag and release, and attach the Figma kits plugin to it.
      contents: write
      # npm Trusted Publishing (OIDC) and provenance.
      id-token: write
      # GitHub Packages.
      packages: write
    env:
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      # Event values go through the environment, never pasted into a script.
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.4
      # No dependency cache in the release job: a poisoned cache would ship in the package.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The tag matches the version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./cli/package.json').version")"
          test "$version" = "$RELEASE_TAG" || { echo "::error::Release tag $RELEASE_TAG is not $version (cli/package.json)."; exit 1; }
      - name: Build and test what ships
        run: |
          pnpm --dir tokens build
          # The version and the snapshot of the public surface must move together (OD-165).
          node scripts/release.mjs check
          pnpm --dir cli test
          pnpm test:package

      # npmjs through Trusted Publishing: npm trusts this workflow (OIDC, id-token: write), so no token
      # is stored and provenance is added on its own. Needs npm 11.5.1 or later. Set up once on npmjs.com:
      # package open-ds, Settings, Trusted Publisher, GitHub Actions, 3dyonic / Open-DS / publish.yml.
      # The first version, before the package exists, can use a short-lived NPM_TOKEN instead.
      - name: npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1
      - name: npmjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: cli
        run: |
          # A version published by hand (the first one, with a 2FA code) is skipped, not an error.
          version="$(node -p "require('./package.json').version")"
          if npm view "open-ds@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice title=npmjs::open-ds@$version is already on npmjs; skipping."; exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          fi
          npm publish --access public --registry https://registry.npmjs.org $DRY
          rm -f .npmrc
          # The published package must keep its command; npm drops a bin entry it thinks is invalid.
          if [ -z "$DRY" ]; then
            # npmjs can take a few minutes to show a new version. A failed npm view prints its error as
            # JSON, so check for the command itself, and wait up to five minutes for it.
            for i in $(seq 1 30); do
              if npm view "open-ds@$version" bin --json --registry https://registry.npmjs.org 2>/dev/null | grep -q '"open-ds"'; then echo "open-ds@$version has its open-ds command."; break; fi
              if [ "$i" = 30 ]; then echo "::error::open-ds@$version is not on npmjs with an open-ds command after five minutes."; exit 1; fi
              sleep 10
            done
          fi

      - name: GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: cli
        run: |
          # GitHub Packages takes only a scope that matches the owner.
          npm pkg set name=@3dyonic/open-ds
          echo "@3dyonic:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          version="$(node -p "require('./package.json').version")"
          if npm view "@3dyonic/open-ds@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice title=GitHub Packages::@3dyonic/open-ds@$version is already published; skipping."; rm .npmrc; exit 0
          fi
          npm publish --registry https://npm.pkg.github.com $DRY
          if [ -z "$DRY" ]; then
            for i in $(seq 1 30); do
              if npm view "@3dyonic/open-ds@$version" bin --json --registry https://npm.pkg.github.com 2>/dev/null | grep -q '"open-ds"'; then echo "@3dyonic/open-ds@$version has its open-ds command."; break; fi
              if [ "$i" = 30 ]; then echo "::error::@3dyonic/open-ds@$version has no open-ds command after five minutes."; rm -f .npmrc; exit 1; fi
              sleep 10
            done
          fi
          rm .npmrc

      # The Figma kits plugin, built from the same schemes as this release (OD-149). It is generated, so
      # it is not committed: every run keeps it as a workflow artifact, and a release gets it attached.
      - name: Build the Figma kits plugin
        run: |
          node scripts/figma-kit.mjs all
          (cd figma && zip -qr ../open-ds-kits-plugin.zip plugin)
      # The anatomy plugin (OD-229), built the same way: it draws the Anatomy reference pages in a
      # scheme's anatomy file, bound to that scheme's kit.
      - name: Build the Figma anatomy plugin
        run: |
          node scripts/figma-anatomy.mjs all
          (cd figma && zip -qr ../open-ds-anatomy-plugin.zip anatomy-plugin)
      - name: Keep the plugins with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-ds-figma-plugins
          path: |
            open-ds-kits-plugin.zip
            open-ds-anatomy-plugin.zip
      # On a merge to master: the tag and the release, made after the packages are published, so a
      # release page always means the packages are out. A release made with GITHUB_TOKEN starts no
      # second run of this workflow.
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          # Notes come from the merged PRs since the last release. If GitHub cannot compare with the
          # last tag (for example after a history rewrite), the release still goes out with plain notes.
          gh release create "$tag" --target "$GITHUB_SHA" --title "open-ds $VERSION" --generate-notes \
            || gh release create "$tag" --target "$GITHUB_SHA" --title "open-ds $VERSION" \
                 --notes "open-ds $VERSION. See the merged pull requests for what changed."
      - name: Attach the plugins to the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG:-v$VERSION}" open-ds-kits-plugin.zip open-ds-anatomy-plugin.zip --clobber
