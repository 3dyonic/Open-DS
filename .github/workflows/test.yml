name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Test the MCP host
        run: pnpm --dir mcp test
      - name: Build
        run: pnpm build

  # The CLI as a user gets it: packed with npm pack and run from the packed file in a fresh app.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack the CLI and deploy a scheme from the packed file
        run: pnpm test:package
      - name: Create a design system project from the packed file, install and build it
        run: pnpm test:create
