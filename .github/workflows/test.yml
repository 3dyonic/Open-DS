name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages --group dev
      - name: Lint
        run: |
          uv run ruff check validator mcp
          uv run ruff format --check validator mcp
      - name: Test
        run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.15"
          enable-cache: true
      - name: Install Python tools
        run: uv sync --frozen --all-packages --group dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Same install and init as README.md. The dev server is not started:
  # `pnpm --dir site dev` keeps running and would hold the job.
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.15"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: README install and init
        run: |
          pnpm install
          uv sync --all-packages
          node cli/bin/open-ds.js init recipes/dense-data.json --out ./my-ds
          test -f ./my-ds/recipe.json
          test -f ./my-ds/theme/tokens.json
          test -f ./my-ds/AGENTS.md
          test -f ./my-ds/links.json
          regen="$(mktemp -d)"
          for stance in accessible-first dense-data multi-brand content-first brand-expressive; do
            bash examples/run-preset.sh "$stance" "$regen/$stance"
            diff -ru "examples/$stance" "$regen/$stance"
          done
