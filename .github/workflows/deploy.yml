# Deploys open-ds.dev to Fly after the tests pass on master (OD-162).
# One app: the website at /, the MCP server at /mcp, health at /health (see Dockerfile, fly.toml).
# Needs the repository secret FLY_API_TOKEN. Without it the job says so and skips, instead of failing.
name: deploy

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  fly:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://open-ds.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: open-ds
    steps:
      - name: Without a Fly token, skip
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice title=Deploy skipped::Add the FLY_API_TOKEN repository secret to deploy to Fly."
      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''
        with:
          # The commit the tests passed on, not whatever master is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Create the app the first time
        if: env.FLY_API_TOKEN != ''
        run: flyctl status --app "$APP" >/dev/null 2>&1 || flyctl apps create "$APP"
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --app "$APP"
      - name: Check it answers
        if: env.FLY_API_TOKEN != ''
        run: |
          curl -fsS "https://$APP.fly.dev/health"
          curl -fsS -o /dev/null "https://$APP.fly.dev/"
