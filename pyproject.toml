[project]
name = "open-ds-workspace"
version = "0.1.0"
description = "Workspace for the Open DS MCP server."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["mcp/tests"]
pythonpath = ["mcp/src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["mcp/src", "mcp/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
