[project]
name = "open-ds-validator"
version = "0.1.0"
description = "Check Open DS packs, recipes, and boilerplate manifests. Placeholder package name."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "3dyonic" }]
keywords = ["design-system", "design-tokens", "dtcg"]
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/3dyonic/Open-DS"
Issues = "https://github.com/3dyonic/Open-DS/issues"

[project.scripts]
open-ds-validator = "open_ds_validator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_ds_validator"]
